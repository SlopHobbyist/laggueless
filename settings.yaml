## laggueless settings

video:
  fullscreen_on_launch: false
  aspect: 1:1            # 1:1 | 4:3 | 16:9
  force_gdi: false       # force GDI for all cores (overrides force_d3d11)
  force_d3d11: false     # use D3D11 present path for 2D cores too
                         # (enables VRR / lower latency, but may tear
                         # on non-GSync/FreeSync displays)
  force_vulkan: true    # use the Vulkan present path. Software cores render
                         # correctly; GL hardware cores are not bridged yet.
                         # CLI equivalent: --vulkan
  vk_no_vsync: true      # (Vulkan only) IMMEDIATE present mode: VRR-smooth if
                         # adaptive sync is enabled in the driver/OS; otherwise
                         # tearing for lowest latency on fixed-rate displays.
                         # CLI equivalent: --no-vsync
                         # Env equivalent: LAGGUELESS_VK_NO_VSYNC=1
  vk_mailbox: false      # (Vulkan only) prefer MAILBOX present mode (no tearing,
                         # replaces queued frame). Ignored when vk_no_vsync is on.
                         # Env equivalent: LAGGUELESS_VK_MAILBOX=1
  vk_validate: false     # (Vulkan only) enable VK_LAYER_KHRONOS_validation.
                         # Requires the Vulkan SDK installed. Adds significant
                         # overhead; only useful for debugging.
                         # Env equivalent: LAGGUELESS_VK_VALIDATE=1
  vk_exclusive_fullscreen: true  # (Vulkan only) acquire true exclusive fullscreen via
                         # VK_EXT_full_screen_exclusive. The swapchain scans out
                         # directly to the display, bypassing the DWM compositor —
                         # removes a frame of compositor latency and unlocks real
                         # tearing / direct VRR for the lowest input-to-pixel delay.
                         # Forces fullscreen on launch (the window must cover the
                         # whole monitor). Falls back to a composited swapchain if
                         # the driver doesn't support it or the mode can't be taken.
                         # CLI equivalent: --vk-exclusive / --no-vk-exclusive
                         # Env equivalent: LAGGUELESS_VK_EXCLUSIVE=1
  match_display_hz: true  # if the monitor refresh is a near-integer multiple
                         # of the core's nominal fps, snap the pacing deadline
                         # to refresh/N so vsync holds every frame for exactly
                         # N refreshes — eliminates scroll judder with no
                         # tearing and no VRR. Audio drift is absorbed by the
                         # DRC resampler, so any pitch shift is inaudible.
  match_strict: false     # speed-accuracy policy for match_display_hz:
                         #   true  = COMPETITION: only snap when the speed error
                         #           is negligible (<0.05%), i.e. a true exact-
                         #           multiple refresh. Standard 60/120/240Hz
                         #           panels run 59.94xN, so they do NOT snap —
                         #           the game runs at exact native speed (legal
                         #           for speedruns) with minor judder.
                         #   false = CASUAL: allow up to 0.30% speed error so
                         #           standard panels are smooth out of the box.
                         #           NOT competition-legal (~0.27% = ~10s/hour).
                         # The console logs the exact resulting speed either way.

audio:
  no_audio: false        # Changes frame timing on some cores/graphics apis
  exclusive_mode: false  # WASAPI exclusive — bypasses Windows mixer, ~9ms buffer.
                         # Locks the device: other apps go silent while running.
                         # EXPERIMENTAL: may not work with USB audio interfaces
                         # (e.g. Focusrite Scarlett). Use low_latency instead.
  low_latency: true      # IAudioClient3 shared low-latency — requests device minimum
                         # period while keeping other apps audible. Requires Win10 1607+.
                         # Falls back to regular shared mode if unavailable.

# LSFG 3.1 frame generation (only used when --lsfg is on the command line).
# Steam's Lossless Scaling UI exposes a lot of options, but only these are
# actually parameters of the LSFG SPIR-V shaders. Everything else in the Steam
# UI (sync mode, max frame latency, capture API, etc.) is app-level behavior
# that this renderer already controls separately.
lsfg:
  multiplier: 0          # 2 / 3 / 4 — number of presented frames per real frame.
                         # Higher = smoother motion but more input latency (extra
                         # FIFO queueing per real frame).
                         # CLI equivalent: --lsfg-multiplier=N
  flow_scale: 0.5        # 0.25 .. 1.0 — optical-flow resolution scale.
                         # 1.0 = full-resolution flow (best quality, more GPU).
                         # 0.5 = half-res flow (cheaper, slight quality loss).
                         # CLI equivalent: --lsfg-flow=F
  performance: false     # Reduced-quality / lower-GPU-cost path. Leave off unless
                         # GPU-bound; an RTX 4090 has plenty of headroom for full quality.
                         # CLI equivalent: --lsfg-perf

system:
  thread_affinity: true    # Pin the emulation thread to P-cores and the audio thread
                            # to a separate core (reduces context-switch jitter on Intel
                            # Alder Lake+, AMD hybrid CPUs). Both threads also get
                            # elevated OS priority (HIGHEST for emu, TIME_CRITICAL for
                            # audio). Falls back to priority-only when hybrid topology
                            # can't be detected (homogeneous CPU, pre-Win10).
                            # CLI equivalent: --thread-affinity

# Run-ahead: reduces input latency by running the core extra frames ahead each
# iteration and displaying the future frame. The displayed frame is what the
# game would render N frames from "now", so reactions to your input appear
# sooner. Costs one extra retro_run() per ghost frame plus a save/load of state
# each visible frame. Cores that don't support savestates, or whose savestates
# are very large, will not benefit (or may stutter).
# Typical useful values: 1 (most games), 2-3 (games with multi-frame input lag).
# 0 disables. Hardware-rendered cores (GL/Vulkan) currently skip run-ahead.
runahead:
  frames: 0              # 0 disables; clamped to 0..10

log:
  pace_log: false        # log audio pacing diagnostics
  timing_log: false      # log frame timing diagnostics
  latency_log: false     # per-stage latency breakdown each second:
                         # input poll → core run → present → pacing wait
                         # (+ DXGI backpressure wait when D3D11 is active).
                         # Includes frame index so regressions are easy to spot.
  env_trace: false       # log libretro environment calls

hotkeys:
  # Each hotkey can have both a keyboard binding and a controller binding.
  # Both are active simultaneously — pressing either triggers the action.
  cycle_aspect_ratio:
    keyboard:   F1
    controller: None
  toggle_fullscreen:
    keyboard:   [F11, Alt+Return]
    controller: None
  exit_fullscreen:
    keyboard:   Escape
  quit:
    keyboard:   Alt+F4
    controller: None
  reset:
    keyboard:   Ctrl+R
    controller: None

# Controls
# ---------
# `universal` is the default mapping applied to every core.
# Each core listed under `cores:` has its own `use_universal` toggle.
#   use_universal: true  -> ignore the per-core `controls:` block, use universal
#   use_universal: false -> use the per-core `controls:` block
#
# Every input has separate `keyboard:` and `controller:` bindings. Both are
# mapped at the same time — either input source will trigger the button.
#
# Naming uses Xbox / XInput vocabulary throughout:
#   Face buttons:  a, b, x, y           (Xbox layout)
#   D-pad:         dpad_up/down/left/right
#   Shoulders:     lb, rb
#   Triggers:      lt, rt
#   Stick clicks:  lstick, rstick
#   Left stick:    lstick_up/down/left/right
#   Right stick:   rstick_up/down/left/right
#   System:        start, back
#
# Keyboard values: SDL/Win32 key names (X, Z, Up, Return, RShift, Space, ...).
# Controller values (XInput): A, B, X, Y, LB, RB, LT, RT, Back, Start,
#   LStick, RStick (stick clicks),
#   DPadUp, DPadDown, DPadLeft, DPadRight,
#   LStickUp, LStickDown, LStickLeft, LStickRight,
#   RStickUp, RStickDown, RStickLeft, RStickRight.
controls:
  # XInput tuning (applies to all controller bindings)
  controller:
    enabled: true
    player1_index: 0       # XInput user index 0..3
    stick_deadzone: 8000   # 0..32767 (XInput default ~7849)
    trigger_threshold: 30  # 0..255 (XInput default 30)

  universal:
    player1:
      dpad_up:
        keyboard:   Up
        controller: DPadUp
      dpad_down:
        keyboard:   Down
        controller: DPadDown
      dpad_left:
        keyboard:   Left
        controller: DPadLeft
      dpad_right:
        keyboard:   Right
        controller: DPadRight
      a:
        keyboard:   X
        controller: A
      b:
        keyboard:   Z
        controller: B
      x:
        keyboard:   S
        controller: X
      y:
        keyboard:   A
        controller: Y
      lb:
        keyboard:   Q
        controller: LB
      rb:
        keyboard:   W
        controller: RB
      start:
        keyboard:   Return
        controller: Start
      back:
        keyboard:   RShift
        controller: Back

# Per-core settings. `use_universal` controls whether the universal mapping
# above is used, or the `controls:` block below it.
cores:
  snes9x:
    dll: snes9x_libretro.dll
    use_universal: true
    controls:
      player1:
        a:
          keyboard:   X
          controller: A
        b:
          keyboard:   Z
          controller: B
        x:
          keyboard:   S
          controller: X
        y:
          keyboard:   A
          controller: Y
        lb:
          keyboard:   Q
          controller: LB
        rb:
          keyboard:   W
          controller: RB
        start:
          keyboard:   Return
          controller: Start
        back:
          keyboard:   RShift
          controller: Back

  bsnes:
    dll: bsnes_libretro.dll
    use_universal: true
    controls:
      player1: {}

  bsnes_mercury:
    dll: bsnes_mercury_performance_libretro.dll
    use_universal: true
    controls:
      player1: {}

  mesen:
    dll: mesen_libretro.dll
    use_universal: false
    # NES only has A/B/Start/Back — universal's A=X, B=Z are fine.
    controls:
      player1:
        a:
          keyboard:   [X, S]
          controller: [A, Y]
        b:
          keyboard:   [Z, A]
          controller: [B, X]
        start:
          keyboard:   Return
          controller: Start
        back:
          keyboard:   RShift
          controller: Back

  mesen_s:
    dll: mesen-s_libretro.dll
    use_universal: true
    controls:
      player1: {}

  nestopia:
    dll: nestopia_libretro.dll
    use_universal: true
    controls:
      player1: {}

  mupen64plus_next:
    dll: mupen64plus_next_libretro.dll
    use_universal: false
    # N64 has a unique layout (C-buttons, Z-trigger). Override the universal map.
    # Left stick = analog stick, right stick = C-buttons, lt = Z-trigger.
    controls:
      player1:
        lstick_up:
          keyboard:   Up
          controller: LStickUp
        lstick_down:
          keyboard:   Down
          controller: LStickDown
        lstick_left:
          keyboard:   Left
          controller: LStickLeft
        lstick_right:
          keyboard:   Right
          controller: LStickRight
        a:
          keyboard:   X
          controller: A
        b:
          keyboard:   Z
          controller: B
        lb:
          keyboard:   Q
          controller: LB
        rb:
          keyboard:   W
          controller: RB
        lt:                       # Z-trigger
          keyboard:   Space
          controller: LT
        # C-buttons (libretro right stick)
        rstick_up:
          keyboard:   I
          controller: RStickUp
        rstick_down:
          keyboard:   K
          controller: RStickDown
        rstick_left:
          keyboard:   J
          controller: RStickLeft
        rstick_right:
          keyboard:   L
          controller: RStickRight
        start:
          keyboard:   Return
          controller: Start

  parallel_n64:
    dll: parallel_n64_libretro.dll
    use_universal: false
    controls:
      player1:
        lstick_up:
          keyboard:   Up
          controller: LStickUp
        lstick_down:
          keyboard:   Down
          controller: LStickDown
        lstick_left:
          keyboard:   Left
          controller: LStickLeft
        lstick_right:
          keyboard:   Right
          controller: LStickRight
        a:
          keyboard:   X
          controller: A
        b:
          keyboard:   Z
          controller: B
        lb:
          keyboard:   Q
          controller: LB
        rb:
          keyboard:   W
          controller: RB
        lt:
          keyboard:   Space
          controller: LT
        rstick_up:
          keyboard:   I
          controller: RStickUp
        rstick_down:
          keyboard:   K
          controller: RStickDown
        rstick_left:
          keyboard:   J
          controller: RStickLeft
        rstick_right:
          keyboard:   L
          controller: RStickRight
        start:
          keyboard:   Return
          controller: Start
