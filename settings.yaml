  # Advanced inputs: extras a core offers beyond its console's controller,
  # e.g. FDS disk swap and VS coins (NES), lid/mic (DS), buttons III-VI
  # (PC Engine). Hidden and never sent to the core unless show_advanced is
  # true (Controls > Player N > Show advanced inputs). They have their own
  # bindings, same format as universal, and start unbound. Turbo buttons
  # and multi-button macros are never offered.
  show_advanced: false
  advanced:
    player1: {}
    player2: {}
    player3: {}
    player4: {}

# Per-core settings. `use_universal: false` gives a core its own map: the
# inputs in its `controls:` block, over the console's controls and universal.
cores:
  snes9x:
    dll: snes9x_libretro.dll
    use_universal: true
    controls:
      player1: {}

  bsnes:
    dll: bsnes_libretro.dll
    use_universal: true
    controls:
      player1: {}

  bsnes_mercury:
    dll: bsnes_mercury_performance_libretro.dll
    use_universal: true
    controls:
      player1: {}

  mesen:
    dll: mesen_libretro.dll
    use_universal: true
    controls:
      player1: {}

  mesen_s:
    dll: mesen-s_libretro.dll
    use_universal: true
    controls:
      player1: {}

  nestopia:
    dll: nestopia_libretro.dll
    use_universal: true
    controls:
      player1: {}

# Per-console controls: what you changed for one console's games (Controls >
# Player N while one of them runs changes these, not universal). Same format
# as universal, listing only the inputs that differ from the console's
# built-in defaults, and `lstick_as_dpad: true/false` per player where you
# changed it for the console. Keys are console ids (nes, snes, n64, psx,
# md...), some with a suffix for a core that lays the pad out its own way
# (md_blastem, lynx_beetle), and the Wii's controllers have their own
# (wii_classic, wii_classic_pro, wii_nunchuk, wii_sideways, wii_remote; a
# GameCube controller on the Wii uses gamecube's). A core with
# use_universal: false above overrides this too.
console_controls: {}

# Which core each console's games open in. Cores > Set Cores edits this.
# Consoles not listed use laggueless' pick. Values are DLL filenames in the
# cores folder, e.g.  snes: snes9x_libretro.dll
console_cores: {}

# Multiplayer adapters, for players 3-4 on consoles with one or two
# controller ports. None is plugged in unless listed here; the checkbox in
# the Controls menu (while one of the console's games is running) edits it.
#   nes: four_score    snes: multitap    md: team_player or ea_4_way_play
#   pce: turbotap      sgx: turbotap
console_adapters: {}

# What each player plays a console's games with, where it has a choice. Only
# Wii games have one; players not listed use a GameCube controller. "Plays
# with" in Controls > Player N (while a Wii game is running) edits it. The
# Wii's choices go under `gamecube` (the GameCube / Wii console):
#   gamecube  classic  classic_pro  nunchuk  remote_sideways  remote
# e.g.
#   gamecube:
#     player1: classic
#     player2: nunchuk
console_controllers: {}

# File > Open Recent (most recent first). Filled in as you play.
recent: []

# The console picked for games whose file type several consoles use (Pick
# Console), by file fingerprint. Filled in as you play; hold Shift while
# dropping a game on the window to pick again. Keeps the last 100.
console_picks: {}
